version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gosec
    - gocritic
    - revive
    - misspell
    - bodyclose
    - errorlint
    - gocyclo
    - unconvert
    - prealloc

linters-settings:
  gocyclo:
    min-complexity: 15
  revive:
    rules:
      - name: var-naming
      - name: indent-error-flow
      - name: error-strings
      - name: early-return

issues:
  exclude-rules:
    - path: _test\.go
      linters: [gosec, errcheck]
