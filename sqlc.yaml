version: "2"
sql:
  - engine: postgresql
    schema: internal/db/migrations
    queries: queries
    gen:
      go:
        package: dbgen
        out: internal/db/dbgen
        sql_package: pgx/v5
        emit_json_tags: true
        emit_pointers_for_null_types: true
        emit_interface: true
        emit_exact_table_names: false
        emit_empty_slices: true
        rename:
          ed25519: Ed25519
          oauth: OAuth
          pat: PAT
          uuid: UUID
          ipfs: IPFS
        overrides:
          - column: "entries.tags"
            go_type:
              import: ""
              type: "[]string"
          - column: "entries.fts_vector"
            go_type:
              type: "string"
              pointer: true
